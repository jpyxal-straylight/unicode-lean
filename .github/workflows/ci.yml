name: ci

# Tier 1 (fast pre-check). Runs on every push and PR.
# Branch protection on `main` should require:
#   ci / hardening
#   ci / build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs on the same ref when a new commit lands.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hardening:
    # Source-level guards. No Lean build required; runs in seconds and
    # catches the common tampering patterns before the slower jobs.
    name: hardening
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: zero sorry / admit
        run: bash scripts/check-sorry.sh

      - name: zero axiom / unsafe / runtime escape
        run: bash scripts/check-no-axiom.sh

      - name: every .lean file is transitively imported from Unicode.lean
        run: bash scripts/check-orphan-files.sh

      - name: UCD source files match pinned SHA-256
        run: bash scripts/check-ucd-hashes.sh

  build:
    # Lake build via the canonical Lean action. Toolchain version comes
    # from the `lean-toolchain` file; the action handles install, cache,
    # and lake fetch.
    name: build
    runs-on: ubuntu-latest
    needs: hardening
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: leanprover/lean-action@v1
        with:
          # Build via lake; toolchain auto-detected from `lean-toolchain`.
          build-args: ""

      - name: smoke-check headline theorems
        run: |
          # Targeted rebuild of the load-bearing top-level modules. If
          # any of these names is renamed without updating CI, the
          # smoke check catches it before merge.
          lake build Unicode.Normalization.QuickCheckSoundnessTheorem
          lake build Unicode.Precis.Preparation
          lake build Unicode.Bidi.Algorithm
          lake build Unicode.Confusables
